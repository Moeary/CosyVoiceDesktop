id: xiyou
title: 花果山 · 群体角色与别名
focus: [群体发言, 一人多名, 无引号心理, 章节标题]
text: |-
  第一回 灵根孕育源流出
  那一日，众猴正在山涧中洗澡，忽见一股瀑布飞泉。众猴拍手称扬道：“好水！好水！原来此处远通山脚之下，直接大海之波。”
  又道：“那一个有本事的，钻进去寻个源头出来，不伤身体者，我等即拜他为王。”
  连呼了三声，忽见丛杂中跳出一个石猴，应声高叫道：“我进去！我进去！”
  好猴！他瞑目蹲身，将身一纵，径跳入瀑布泉中。石猴暗想：这里边倒是个安身的好去处。
  他跳出水外，笑道：“大造化！大造化！”
  众猴把他围住，问道：“里面怎么样？水有多深？”
  “没水！没水！原来是一座铁板桥。”
  “你看见什么了？”
  “桥那边是一座天造地设的家当，叫做水帘洞洞天。”
  众猴听得，个个欢喜，都道：“你还先走，带我们进去！”
  美猴王端坐上面，道：“列位呵，‘人而无信，不知其可’。你们才说有本事进得来、出得去者，就拜他为王。”
  众猴听说，即拱伏无违，一个个序齿排班，朝上礼拜，都称“千岁大王”。
