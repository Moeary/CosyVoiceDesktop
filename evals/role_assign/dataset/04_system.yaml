id: system
title: 系统流网文 · 系统提示与心理
focus: [【】系统提示, 系统作为发声者, 心理与发誓, 选角给系统电子音]
text: |-
  第三章 签到
  清晨六点，林默被一阵电子音吵醒。
  【叮！每日签到成功，获得：初级剑术×1。】
  林默揉了揉眼睛，心想：又是剑术，我一个送外卖的要剑术干什么？
  “系统，能换成驾驶技能吗？”
  【宿主权限不足，无法兑换。】
  “那你倒是给我点有用的。”
  楼下传来房东王阿姨的大嗓门：“小林！这个月房租什么时候交？”
  “下周，王姨，下周一定！”
  王阿姨哼了一声，脚步声渐渐远了。林默叹了口气，暗暗发誓：等我攒够钱，第一件事就是搬家。
  【温馨提示：宿主当前存款为三百二十七元。】
  他盯着那行字，半天没说出话来。
