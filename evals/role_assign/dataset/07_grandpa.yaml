id: grandpa
title: 爷爷讲狐狸 · 故事中的故事
difficulty: hard
focus: [跨段落连续引语, 嵌套引号转述, 故事人物不是说话人, 孩童第一人称, 提示语在引号后]
text: |-
  停电的那个晚上，爷爷点起一根蜡烛，我们三个小孩挤在他脚边。
  “爷爷，讲个鬼故事！”小胖第一个嚷起来。
  “讲狐狸，讲狐狸！”妹妹拽着爷爷的袖子。
  爷爷咳了两声，眯起眼睛：“那我讲个狐狸借火的故事。
  “早些年，咱们村后山住着一个打柴的后生，姓吴，大家都叫他吴老实。有天夜里，他砍柴回来晚了，走到半山腰，看见路边坐着个穿白衣裳的姑娘。
  “那姑娘冲他一笑，说：‘大哥，能借个火吗？我家灯灭了。’吴老实心想，深更半夜的，哪来的姑娘？可他心肠软，还是把火镰递了过去。
  “姑娘接过火镰，手指头冰凉冰凉的。她又说：‘大哥，你送我一段路吧，我怕黑。’”
  “然后呢然后呢？”小胖急得直拍大腿。
  “别打岔。”我瞪了他一眼。
  爷爷笑了笑，接着说：“吴老实就跟着她走。走着走着，他低头一看——那姑娘的裙子底下，拖着一条毛茸茸的大尾巴！”
  妹妹“哇”地一声扑进我怀里。
  “那他跑了没有？”我故作镇定地问。
  “跑？他没跑。”爷爷压低了声音，“他说：‘姑娘，你的尾巴露出来了。’那狐狸一愣，扑哧一声笑了：‘你这人倒老实，别人见了早吓跑了。’第二天，吴老实家门口就多了一捆上好的柴火。”
  屋里安静了一会儿。
  “爷爷，”妹妹从我怀里探出头，小声问，“那个吴老实，是不是就是你呀？”
  爷爷没回答，只是把蜡烛往我们这边推了推。烛光里，我好像看见他的眼角弯了一下。
