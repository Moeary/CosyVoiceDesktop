id: village
title: 村委会征地 · 多人抢话
difficulty: hard
focus: [六人以上抢话, 同姓角色, 提示语在引号后, 无名村民, 话中转述他人原话, 无引号心声]
text: |-
  晚上七点，村委会的大喇叭响了三遍，院子里还是只来了一半的人。
  赵德厚敲了敲桌子：“人不齐也开，等不起了。”
  “书记，啥事这么急？明天还得下地呢。”有人在后排喊。
  “征地的事。”赵德厚把烟掐了，“林经理，你跟大伙说说。”
  穿西装的年轻人站起来，扶了扶眼镜：“各位乡亲，我们公司准备在河滩那片建一个物流园，补偿标准是每亩四万二。”
  院子里嗡的一声炸开了。
  “四万二？打发要饭的呢！”
  “隔壁镇上个月一亩给了六万！”
  “安静！安静！”王会计站起来，把账本拍在桌上，“听人家把话说完。”
  林经理清了清嗓子：“除了补偿款，物流园建成以后，优先招本村的年轻人——”
  “招去干啥？搬箱子？”王二婶嗓门最大，“我家小军是念过大专的！”
  “妈，你别说了。”王小军拉了拉她的袖子。
  “我凭啥不说？地是你爷爷开出来的！”
  李大爷一直蹲在墙根抽旱烟，这时慢悠悠地开了口：“老赵，你自己家那三亩，签了没有？”
  赵德厚的脸一下子红了。
  “签……签了。”
  “我就知道。”李大爷吐出一口烟，“前天在镇上，我还听你跟人说‘这回不签的都是傻子’。”
  院子里又是一阵骚动。
  王会计赶紧打圆场：“李叔，话不能这么说，书记签字是带个头——”
  “带头？带头把大伙往沟里带？”
  林经理额头冒了汗，心里暗暗叫苦：早知道这个村这么难缠，就该让老张来。
  “这样吧，”他咬了咬牙，“每亩再加三千，今晚签字的，另外发一千块奖励。”
  王二婶愣了一下，扭头看儿子。王小军低着头，半天才憋出一句：“妈，四万六……也不少了。”
  “你个没出息的！”王二婶骂完，却没有再往外走。
  后排有人小声问：“今晚签……真给一千？”
  “当场给现金。”
  人群慢慢往桌子前面挪。只有李大爷还蹲在墙根，望着河滩的方向，一句话也没说。
