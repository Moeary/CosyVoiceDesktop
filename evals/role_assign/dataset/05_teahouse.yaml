id: teahouse
title: 茶馆风波 · 长场景跨批次
focus: [超过 40 段触发分批, 跨批次说话人延续, 六个角色多称呼, 无名茶客]
text: |-
  民国十六年的春天，城南的福来茶馆照旧开门。
  掌柜钱有福把算盘拨得噼啪响，冲后堂喊：“小六子，水开了没有？”
  “开了开了！”小六子拎着大铜壶一路小跑出来。
  靠窗的周先生已经摆好了醒木。茶客们三三两两地落座。
  “周先生，今儿说哪一段？”
  “还是接着昨天的，说那赵子龙单骑救主。”
  众人一齐叫好：“好！”
  周先生清了清嗓子，醒木一拍：“上回书说到，长坂坡前，曹兵八十三万……”
  话音未落，门帘一挑，进来一个穿灰军装的人。
  茶馆里霎时安静下来。
  “哪位是掌柜？”
  钱有福赶紧迎上去：“老总，小的就是。您喝点什么？”
  “我姓赵，是城防营的连长。”那人摘下帽子，“今儿不喝茶，来找个人。”
  “找人？”
  “一个卖花的姑娘，叫春妮。”
  小六子手里的铜壶一歪，热水溅了一地。
  老钱瞪了他一眼，回头赔着笑：“赵长官，我们这儿是茶馆，哪有什么卖花的姑娘。”
  “有没有，我问问就知道。”
  赵连长的目光在茶客脸上一个个扫过去。
  周先生慢悠悠地开了口：“长官，找人是好事，可也别耽误大伙听书不是？”
  “你是说书的？”
  “混口饭吃。”
  “那你接着说，我听着。”
  赵连长拣了张空桌坐下，把枪往桌上一放。
  周先生拿起醒木，又放下，半晌才道：“刚才说到哪儿了？”
  没人敢接话。
  小六子缩在柜台后面，心里直打鼓：春妮姐今早还在后门等我送水，可千万别这会儿进来。
  偏偏就在这时，后门吱呀一声开了。
  “六子哥，今天的茉莉花——”
  一个梳着辫子的姑娘探进头来，话说到一半，便看见了满屋子的人。
  赵连长站了起来。
  “春妮？”
  姑娘脸色发白，往后退了半步：“我……我不认得你。”
  “你娘托我来找你，”赵连长的声音忽然低了下来，“她病了，想见你最后一面。”
  春妮手里的花篮掉在地上，茉莉花滚了一地。
  钱掌柜长长地叹了口气：“作孽哟。”
  周先生把醒木轻轻一放：“今儿这书，就说到这儿吧。”
  茶客们默默起身，谁也没有再说话。
