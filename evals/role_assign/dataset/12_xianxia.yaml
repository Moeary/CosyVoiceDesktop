id: xianxia
title: 外门大比 · 系统面板与传音
split: holdout
difficulty: hard
focus: [系统面板, 『』传音, 拟声词独立成行, 代称后揭晓身份, 提示语主语不在开头, 人群喊话, 混合心声片段]
text: |-
  第三十七章 外门大比
  【系统：检测到宿主进入擂台，新手任务已发布，击败任意一名对手，奖励灵石一百。】
  林凡站在擂台中央，看着眼前浮现的半透明面板，嘴角抽了抽。
  “又是这种奖励……”他小声嘀咕。
  台下顿时一片哄笑。
  “这不是那个三年都没突破炼气二层的废物吗？”
  “他也敢上擂台？”
  一个锦衣青年慢条斯理地走上台，手中折扇轻摇：“林师弟，现在认输，还来得及。”
  林凡抬头看了他一眼：“你是谁？”
  “在下赵元，内门弟子。”锦衣青年微微一笑，“奉长老之命，来给外门的师弟们指点一二。”
  『小心，他已经是筑基初期了。』一道清冷的女声在林凡脑海中响起。
  林凡心道：“苏师姐？她怎么会……”
  『别分心，看他的扇子。』
  赵元折扇一合，身形骤然暴起。
  轰——！
  擂台上烟尘四起。
  【系统：宿主受到攻击，触发被动技能“铁布衫”，伤害减免五成。】
  烟尘散去，林凡毫发无伤地站在原地，拍了拍衣袖上的灰。
  “怎么可能？！”赵元脸色大变。
  台下鸦雀无声。片刻之后，不知是谁先喊了一声：“好！”
  紧接着，叫好声此起彼伏。
  高台上，白须长老捋了捋胡子，转头对身旁的白衣女子道：“婉清，这就是你说的那个孩子？”
  “是，师父。”苏婉清低声道，“弟子早就觉得，他不简单。”
  “哼，不简单？”长老哈哈一笑，“那就让老夫看看，他到底能走多远。”
  擂台上，赵元咬牙切齿：“林凡，你给我等着！”
  林凡耸耸肩，心里却在盘算：一百灵石，够买三瓶聚气丹了。
  【系统：新手任务完成，奖励灵石一百已发放。】
