id: wuxia
title: 寿宴惊变 · 长篇武侠
difficulty: hard
focus: [约 100 段跨三批, 蒙面人身份揭晓, 绰号与多称呼, 人群喊话, 无引号心声, 引号作绰号]
text: |-
  第十二回 寿宴惊变
  腊月初八，洛阳孙家张灯结彩。“铁掌”孙不二六十大寿，江湖上有头有脸的人物来了大半。
  沈青崖到得晚，刚跨进院门，就被一个满脸络腮胡的大汉拦住了。
  “哟，这不是沈少侠吗？听说你上个月在潼关一剑挑了黑风寨，是真是假？”
  “胡三哥说笑了，不过是运气好。”
  “运气？”胡大海哈哈大笑，一巴掌拍在他肩上，“走走走，先喝三碗再说！”
  两人刚落座，后堂珠帘一响，一个穿鹅黄袄子的姑娘端着酒壶走了出来。
  “沈大哥！”她眼睛一亮，几步就到了跟前，“我还以为你不来了呢。”
  “小蛮姑娘，”沈青崖起身拱手，“孙老爷子的寿宴，晚辈怎敢不来。”
  孙小蛮撇撇嘴：“又叫我姑娘，听着怪生分的。”
  胡大海在一旁挤眉弄眼：“小蛮，你怎么不给胡叔叔倒酒？偏心！”
  “胡叔叔自己有手。”
  满桌的人都笑了。
  正热闹间，福伯快步走到堂前，扯着嗓子喊道：“老爷到——”
  众宾客纷纷起身。孙不二一身绛紫长袍，须发皆白，却精神矍铄，抱拳朝四方一揖：“诸位远道而来，孙某感激不尽。今日只叙旧情，不谈恩怨，大家尽兴！”
  “恭祝孙老爷子福如东海，寿比南山！”众人齐声道。
  酒过三巡，院外忽然传来一声长笑。
  “好一个不谈恩怨！孙不二，二十年前雁门关下那三十七条人命，你也不谈了吗？”
  话音未落，一道黑影已经越过高墙，稳稳落在院子当中。那人一身黑衣，脸上蒙着黑巾，手里提着一柄细长的弯刀。
  满院子的人霎时安静下来。
  孙不二脸色一沉：“阁下是谁？既然来贺寿，何必藏头露尾？”
  “贺寿？”蒙面人冷笑，“我是来讨债的。”
  胡大海拍案而起：“哪来的狂徒，敢在孙家撒野！”他话没说完，人已经扑了出去，双拳带风，直取对方面门。
  蒙面人身形一晃，弯刀在月光下划出一道银弧。胡大海只觉手腕一麻，整个人倒飞出去，撞翻了两张桌子。
  “胡三哥！”沈青崖抢上前扶住他。
  “不碍事，不碍事……”胡大海龇牙咧嘴地爬起来，“这小子的刀，邪门得很。”
  沈青崖缓缓拔剑，心中暗想：这一刀的路数，倒像是柳家的“回风十三式”。可柳家早在二十年前就……
  “沈少侠，”蒙面人似乎看穿了他的心思，“你若是聪明人，就别趟这浑水。”
  “孙老爷子待我有恩。”沈青崖横剑当胸，“阁下有什么冤屈，不妨当着天下英雄的面说清楚。”
  “说清楚？好！”
  蒙面人一把扯下脸上的黑巾。月光下，露出一张苍白清瘦的脸，左颊上一道刀疤从眉骨一直划到嘴角。
  人群里有人失声叫道：“柳……柳随风！他不是死了吗？”
  “柳家二当家，柳随风。”那人一字一顿地说，“二十年前，孙不二假传军令，引我柳家三十七口去雁门关送死，只有我一个人从死人堆里爬了出来。”
  所有人的目光都落在孙不二身上。
  孙不二沉默良久，长长地叹了一口气：“随风，你长大了。”
  “少跟我套近乎！”
  “当年的军令，是我传的，这不假。”孙不二的声音很平静，“可那道军令，是你大哥亲手交给我的。”
  柳随风的刀尖微微一颤：“你胡说！”
  “爹！”孙小蛮从人群里冲出来，挡在父亲身前，“你为什么从来不跟我说这些？”
  孙不二摸了摸女儿的头，没有回答。他转向柳随风，从怀里掏出一封泛黄的信：“这是你大哥的亲笔，二十年了，我一直在等柳家的人来取。”
  柳随风盯着那封信，握刀的手青筋暴起，却迟迟没有伸手去接。
  沈青崖看着这一幕，心里一阵发紧：倘若信是真的，那这二十年的仇恨，又该算在谁头上？
  良久，柳随风收刀入鞘，接过书信，转身跃上墙头。
  “孙不二，这笔账我会查清楚。”他的声音远远传来，“若你骗我，我还会再来。”
  夜风吹过，满院灯笼摇摇晃晃。福伯颤巍巍地走上前：“老爷，这寿宴……还接着办吗？”
  孙不二望着墙头的方向，半晌才道：“办。把酒都满上。”
